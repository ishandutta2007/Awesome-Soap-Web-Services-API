<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090D16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1B4B"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#A855F7"/><stop offset="50%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#34D399"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".4"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-2deg)}}@keyframes nodeGlow{0%{fill:#8b5cf6;filter:drop-shadow(0 0 6px #8b5cf6)}50%{fill:#38bdf8;filter:drop-shadow(0 0 12px #38bdf8)}}.bg{fill:url(#bgGrad)}.title{font-weight:800;font-size:46px;fill:url(#titleGrad);letter-spacing:-.5px}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.anim-pulse{animation:pulse 6s ease-in-out infinite;transform-origin:center}.anim-float1{animation:float1 8s ease-in-out infinite}.anim-float2{animation:float2 9s ease-in-out infinite}.anim-dash{stroke-dasharray:8,8;animation:dash 20s linear infinite}.anim-node{animation:nodeGlow 4s ease-in-out infinite}</style><rect width="1200" height="320" class="bg" rx="16"/><circle cx="150" cy="80" r="180" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)"/><circle cx="1050" cy="240" r="220" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)" style="animation-delay:-3s"/><g opacity=".25"><line x1="850" x2="1000" y1="60" y2="140" stroke="#38BDF8" stroke-width="2" class="anim-dash"/><line x1="1000" x2="920" y1="140" y2="240" stroke="#8B5CF6" stroke-width="2" class="anim-dash"/><line x1="920" x2="1100" y1="240" y2="260" stroke="#34D399" stroke-width="2" class="anim-dash"/><line x1="1000" x2="1120" y1="140" y2="100" stroke="#EC4899" stroke-width="2" class="anim-dash"/><circle cx="850" cy="60" r="6" class="anim-node"/><circle cx="1000" cy="140" r="8" class="anim-node" style="animation-delay:-1s"/><circle cx="920" cy="240" r="7" class="anim-node" style="animation-delay:-2s"/><circle cx="1100" cy="260" r="5" class="anim-node" style="animation-delay:-3s"/><circle cx="1120" cy="100" r="6" class="anim-node" style="animation-delay:-1.5s"/></g><g class="anim-float1"><rect width="100" height="32" x="850" y="80" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="16"/><text x="900" y="101" class="badge-text" text-anchor="middle">WSDL 2.0</text></g><g class="anim-float2"><rect width="110" height="32" x="980" y="180" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="16"/><text x="1035" y="201" class="badge-text" text-anchor="middle" style="fill:#a855f7">WS-Security</text></g><g transform="translate(60, 0)"><rect width="190" height="28" x="0" y="52" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="14"/><text x="16" y="70" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ENTERPRISE API GUIDE</text><text x="0" y="140" class="title">Awesome SOAP Web Services</text><text x="0" y="185" class="subtitle">Curated list of enterprise SOAP APIs, WSDL tooling, and self-hosted frameworks</text><g transform="translate(0, 225)"><circle cx="8" cy="8" r="4" fill="#34D399"/><text x="24" y="12" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">SaaS Platforms &amp; Financial APIs</text><circle cx="280" cy="8" r="4" fill="#38BDF8"/><text x="296" y="12" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Open-Source Frameworks</text><circle cx="510" cy="8" r="4" fill="#A855F7"/><text x="526" y="12" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">WS-* Standards &amp; WSDL Tools</text></g></g></svg>