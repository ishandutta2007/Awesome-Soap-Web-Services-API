<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94A3B8; letter-spacing: 0.2px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38BDF8; }
    
    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes nodeGlow {
      0%, 100% { fill: #8B5CF6; filter: drop-shadow(0 0 6px #8B5CF6); }
      50% { fill: #38BDF8; filter: drop-shadow(0 0 12px #38BDF8); }
    }

    .anim-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .anim-float1 { animation: float1 8s ease-in-out infinite; }
    .anim-float2 { animation: float2 9s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8, 8; animation: dash 20s linear infinite; }
    .anim-node { animation: nodeGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" class="bg" rx="16" />

  <!-- Dynamic Background Glow Elements (Behind Content) -->
  <circle cx="150" cy="80" r="180" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="220" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)" style="animation-delay: -3s;" />

  <!-- Animated Network Connections (Subtle Background Graphics) -->
  <g opacity="0.25">
    <line x1="850" y1="60" x2="1000" y2="140" stroke="#38BDF8" stroke-width="2" class="anim-dash" />
    <line x1="1000" y1="140" x2="920" y2="240" stroke="#8B5CF6" stroke-width="2" class="anim-dash" />
    <line x1="920" y1="240" x2="1100" y2="260" stroke="#34D399" stroke-width="2" class="anim-dash" />
    <line x1="1000" y1="140" x2="1120" y2="100" stroke="#EC4899" stroke-width="2" class="anim-dash" />

    <!-- Animated Nodes -->
    <circle cx="850" cy="60" r="6" class="anim-node" />
    <circle cx="1000" cy="140" r="8" class="anim-node" style="animation-delay: -1s;" />
    <circle cx="920" cy="240" r="7" class="anim-node" style="animation-delay: -2s;" />
    <circle cx="1100" cy="260" r="5" class="anim-node" style="animation-delay: -3s;" />
    <circle cx="1120" cy="100" r="6" class="anim-node" style="animation-delay: -1.5s;" />
  </g>

  <!-- Decorative Pills / Tags (Positioned away from text) -->
  <g class="anim-float1">
    <rect x="850" y="80" width="100" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="900" y="101" text-anchor="middle" class="badge-text">WSDL 2.0</text>
  </g>
  <g class="anim-float2">
    <rect x="980" y="180" width="110" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="1035" y="201" text-anchor="middle" class="badge-text" style="fill: #A855F7;">WS-Security</text>
  </g>

  <!-- Foreground Content Block (Clear & Unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <rect x="0" y="52" width="190" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="16" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">ENTERPRISE API GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome SOAP Web Services</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated list of enterprise SOAP APIs, WSDL tooling, and self-hosted frameworks</text>

    <!-- Feature Dots -->
    <g transform="translate(0, 225)">
      <circle cx="8" cy="8" r="4" fill="#34D399" />
      <text x="24" y="12" font-family="system-ui, sans-serif" font-size="14" fill="#E2E8F0" font-weight="500">SaaS Platforms &amp; Financial APIs</text>

      <circle cx="280" cy="8" r="4" fill="#38BDF8" />
      <text x="296" y="12" font-family="system-ui, sans-serif" font-size="14" fill="#E2E8F0" font-weight="500">Open-Source Frameworks</text>

      <circle cx="510" cy="8" r="4" fill="#A855F7" />
      <text x="526" y="12" font-family="system-ui, sans-serif" font-size="14" fill="#E2E8F0" font-weight="500">WS-* Standards &amp; WSDL Tools</text>
    </g>
  </g>
</svg>
